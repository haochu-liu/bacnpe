[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bacnpe"
version = "0.1.0"
description = "Detection of local recombination and mutation hotspots using NPE with ClonalOrigin simulations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "tqdm>=4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bacnpe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
