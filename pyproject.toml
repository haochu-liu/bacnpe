[build-system]
requires = ["setuptools>=77"]   # SPDX `license` string and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "bacnpe"
version = "0.3.0"
description = "Detection of local recombination and mutation hotspots using NPE with ClonalOrigin simulations."
readme = "README.md"
authors = [
    { name = "Haochu Liu" },
    { name = "Richard G. Everitt" },
    { name = "Xavier Didelot" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"   # sbi needs Python >= 3.10
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "tqdm>=4",
    "torch>=2.5",
    "sbi>=0.26",
    "six",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bacnpe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
